name: Refresh housing + schools + lot data
on:
  schedule:
    - cron: "17 9 3 * *"      # 3rd of each month, 09:17 UTC (Zillow posts mid-month; this catches the prior release)
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build housing.json
        env:
          CENSUS_KEY: ${{ secrets.CENSUS_KEY }}
        run: python scripts/refresh_housing.py --census-key "$CENSUS_KEY"
      - name: Build schools.json
        run: python scripts/refresh_schools.py --ratings data-sources/tea_ratings.csv --private data-sources/pss.csv
      - name: Build lot_stats.json
        run: python scripts/refresh_lots.py
      - name: Commit if changed
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data/housing.json data/schools.json data/lot_stats.json
          git diff --cached --quiet || git commit -m "Refresh housing + schools + lot data $(date -u +%F)"
          git push
