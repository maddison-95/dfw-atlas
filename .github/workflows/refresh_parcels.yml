name: Refresh parcel data (self-hosted lots)
# Builds a self-hosted alternative to the map's live per-click parcel lookup. scripts/build_parcels.py pulls
# the same TxGIO StratMap feed the page already queries live, for the five DFW-area counties (Dallas, Collin,
# Denton, Tarrant, Rockwall); this workflow tiles the result with tippecanoe and publishes it as a single
# file on this repo's own "parcels-data" GitHub Release (no external host/account needed -- Release assets
# are served from GitHub's own CDN, which supports the byte-range reads a .pmtiles file needs).
#
# This is purely additive: the site keeps using the live per-click feed until data/config.json's
# parcels_pmtiles_url is filled in by hand with the asset URL this workflow prints at the end of a real run
# (see the last step's log, or the repo's Releases page). Nothing on the site changes on its own.
#
# Runs quarterly -- appraisal rolls are set once a year and barely move between annual updates, so there's
# no reason to run this monthly like the housing/schools/lending refresh.
on:
  schedule:
    - cron: "0 8 5 1,4,7,10 *"   # 5th of Jan/Apr/Jul/Oct, 08:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only: print a few sample records + row-count estimate per county, write/publish nothing"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tippecanoe (vector-tile builder)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe

      - name: Dry run -- sample records + row counts only
        if: ${{ inputs.dry_run == true }}
        run: python scripts/build_parcels.py --dry-run

      - name: Pull parcel data from TxGIO StratMap (five counties)
        if: ${{ inputs.dry_run != true }}
        run: python scripts/build_parcels.py --out /tmp/parcels.ndjson

      - name: Build vector tiles
        if: ${{ inputs.dry_run != true }}
        run: |
          # zoom range matches the client: LOTS_MINZOOM is 15, so tiles from 13 up cover that with a little
          # headroom either side; extend-zooms/drop-densest keep dense urban blocks from being thinned or
          # bloating the file past what's needed to read a lot line at street level.
          tippecanoe -o /tmp/parcels.pmtiles -l lots \
            --minimum-zoom=13 --maximum-zoom=16 --extend-zooms-if-still-dropping \
            --drop-densest-as-needed --coalesce-densest-as-needed \
            -f /tmp/parcels.ndjson
          echo "--- tile file size ---"
          ls -lh /tmp/parcels.pmtiles

      - name: Publish as a GitHub Release asset
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete parcels-data --yes --cleanup-tag 2>/dev/null || true
          gh release create parcels-data /tmp/parcels.pmtiles \
            --title "Self-hosted parcel data (auto-refreshed quarterly)" \
            --notes "Built $(date -u +%F) from TxGIO StratMap (Dallas, Collin, Denton, Tarrant, Rockwall counties). Copy the .pmtiles asset's download URL below into data/config.json's parcels_pmtiles_url to switch the map's 'Lot lines & sizes' layer from a live per-pan query to this static snapshot -- see site README section 7. This release is replaced wholesale by the next quarterly run, so the URL below stays stable across refreshes; nothing needs re-pasting after the first time."

      - name: Print the asset URL to paste into data/config.json
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Paste this URL into data/config.json's parcels_pmtiles_url (README section 7):"
          gh release view parcels-data --json assets --jq '.assets[0].browser_download_url'
